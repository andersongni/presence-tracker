name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore PresenceTracker.sln

      - name: Build project
        run: dotnet build -c Release --no-restore PresenceTracker.sln

      - name: Test
        run: dotnet test -c Release --no-build PresenceTracker.sln

      - name: Regression - calendar multi-day selection
        run: >
          dotnet test -c Release --no-build
          tests/PresenceTracker.Tests/PresenceTracker.Tests.csproj
          --filter "FullyQualifiedName~CalendarSelectionTests"
          --logger "console;verbosity=normal"

      - name: Regression - backup and restore
        run: >
          dotnet test -c Release --no-build
          tests/PresenceTracker.Tests/PresenceTracker.Tests.csproj
          --filter "FullyQualifiedName~SqliteBackupServiceTests"
          --logger "console;verbosity=normal"

      - name: Publish for installer
        run: >
          dotnet publish src/PresenceTracker/PresenceTracker.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/publish/win-x64

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe não encontrado após a instalação do Inno Setup.' }
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & $iscc installer/PresenceTracker.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o instalador (código $LASTEXITCODE)." }

      - name: Package installer ZIP fallback
        shell: pwsh
        run: |
          $exe = "artifacts/installer/PresenceTracker-Setup.exe"
          $zip = "artifacts/installer/PresenceTracker-Setup.zip"
          if (-not (Test-Path $exe)) { throw "Instalador não encontrado: $exe" }
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $exe -DestinationPath $zip -Force
          Get-Item $exe, $zip | Format-Table Name, Length

      - name: Publish installer to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest
          body: |
            ## Download

            - **[PresenceTracker-Setup.exe](https://github.com/andersongni/presence-tracker/releases/download/latest/PresenceTracker-Setup.exe)** — instalador Windows (recomendado)
            - **[PresenceTracker-Setup.zip](https://github.com/andersongni/presence-tracker/releases/download/latest/PresenceTracker-Setup.zip)** — alternativa se o navegador bloquear o download do `.exe` (baixe o ZIP, extraia e execute o instalador)

            Instalador gerado automaticamente a partir de `main`.
          artifacts: |
            artifacts/installer/PresenceTracker-Setup.exe
            artifacts/installer/PresenceTracker-Setup.zip
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          omitBodyDuringUpdate: false
